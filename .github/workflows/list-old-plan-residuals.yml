name: Lister residus ancien plan (lecture seule)

on:
  workflow_dispatch: {}

jobs:
  list:
    runs-on: ubuntu-latest
    env:
      INTERVALS_API_KEY: ${{ secrets.INTERVALS_API_KEY }}
      INTERVALS_ATHLETE_ID: ${{ secrets.INTERVALS_ATHLETE_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dependances
        run: pip install -r requirements.txt

      - name: Lister les residus de l'ancien plan (lecture seule, aucune suppression)
        run: python scripts/list_old_plan_residuals.py
